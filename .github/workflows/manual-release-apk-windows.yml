name: Manual Android and Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version including optional build number, for example 9.0.29+97"
        required: true
        type: string
      release_tag:
        description: "GitHub Release tag (defaults to v<version without +build>)"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: manual-release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  APP_VERSION: ${{ inputs.version }}
  INSTALLER_NAME: lantern-installer
  BUILD_TYPE: production

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-scope: manual-release-android
          gomobile-cache: "true"

      - name: Set up Android
        uses: ./.github/actions/setup-android

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Stamp version
        shell: bash
        run: |
          python3 - "$APP_VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys
          version = sys.argv[1].strip()
          path = Path("pubspec.yaml")
          text = path.read_text()
          updated, count = re.subn(r"(?m)^version:\s*.*$", f"version: {version}", text, count=1)
          if count != 1:
              raise SystemExit("pubspec.yaml version field not found")
          path.write_text(updated)
          PY

      - name: Generate temporary Android signing configuration
        shell: bash
        run: |
          set -euo pipefail
          key_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          key_alias="lantern-$(python3 -c 'import secrets; print(secrets.token_hex(8))')"
          keytool -genkeypair -noprompt -v \
            -keystore android/app/keystore.release.jks \
            -storepass "$key_password" -keypass "$key_password" \
            -alias "$key_alias" -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=Lantern Temporary Release, OU=Build, O=Lantern, C=US"
          mkdir -p "$HOME/.gradle"
          {
            echo 'org.gradle.caching=true'
            echo 'android.useAndroidX=true'
            echo 'android.enableJetifier=true'
            echo "KEYSTORE_FILE=keystore.release.jks"
            echo "KEYSTORE_PWD=$key_password"
            echo "KEY_ALIAS=$key_alias"
            echo "KEY_PWD=$key_password"
          } > "$HOME/.gradle/gradle.properties"
          cat > app.env <<EOF
          MACOS_APP_GROUP=org.getlantern.lantern
          WINDOWS_APP_USER_MODEL_ID=org.getlantern.lantern
          WINDOWS_GUID=$(python3 -c 'import uuid; print(uuid.uuid4())')
          EOF

      - name: Build release APK
        run: |
          make install-android-deps
          make android-release APP_VERSION="$APP_VERSION" BUILD_TYPE=production INSTALLER_NAME=lantern-installer

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lantern-release-apk
          path: lantern-installer.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows installer and portable build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-scope: manual-release-windows

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Set up MinGW
        shell: bash
        run: bash ./scripts/ci/setup-windows-toolchain.sh

      - name: Test Windows VPN service and IPC permissions
        shell: pwsh
        run: |
          go test ./lantern-core/windows_service
          go test github.com/getlantern/radiance/ipc

      - name: Install Inno Setup
        shell: bash
        run: ./scripts/ci/choco-retry.sh -y innosetup --version=6.7.1 --allow-downgrade

      - name: Install Inno Setup translations
        shell: pwsh
        run: |
          $languageDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          if (-not (Test-Path $languageDir)) {
            throw "Inno Setup Languages directory not found: $languageDir"
          }
          foreach ($language in @('Farsi.isl', 'ChineseSimplified.isl')) {
            $source = Join-Path $env:GITHUB_WORKSPACE "windows\packaging\exe\isl\$language"
            if (-not (Test-Path $source)) {
              throw "Translation file not found: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $languageDir $language) -Force
          }
          Get-ChildItem $languageDir -Filter '*.isl' | Select-Object Name

      - name: Generate application environment
        shell: pwsh
        run: |
          $guid = [guid]::NewGuid().ToString()
          @(
            'MACOS_APP_GROUP=org.getlantern.lantern'
            'WINDOWS_APP_USER_MODEL_ID=org.getlantern.lantern'
            "WINDOWS_GUID=$guid"
          ) | Set-Content -Path app.env -Encoding utf8

      - name: Stamp version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $path = 'pubspec.yaml'
          $text = Get-Content $path -Raw
          $updated = [regex]::Replace($text, '(?m)^version:\s*.*$', "version: $version", 1)
          if ($updated -eq $text) { throw 'pubspec.yaml version field not found' }
          Set-Content -Path $path -Value $updated -Encoding utf8

      - name: Build Windows release bundle
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: make windows-release APP_VERSION=$env:APP_VERSION BUILD_TYPE=production INSTALLER_NAME=lantern-installer

      - name: Test Windows connection error translations
        run: flutter test --no-pub test/core/extensions/windows_service_error_test.dart

      - name: Package Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          dart pub global activate fastforge
          fastforge package --platform=windows --targets=exe --skip-clean --build-dart-define=BUILD_TYPE=production --build-dart-define=VERSION=$env:APP_VERSION --flutter-build-args=verbose
          $distDir = "dist/$env:APP_VERSION"
          $source = Get-ChildItem -LiteralPath $distDir -Filter '*.exe' -File |
            Where-Object { $_.Name -match 'windows-setup' } |
            Select-Object -First 1
          if ($null -eq $source) {
            Get-ChildItem -LiteralPath $distDir -Recurse -File | Select-Object FullName
            throw "Windows installer not found in $distDir"
          }
          Move-Item -LiteralPath $source.FullName -Destination lantern-installer.exe -Force

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($file in @('lantern.exe', 'liblantern.dll', 'lanternd.exe')) {
            if (-not (Test-Path (Join-Path $bundle $file) -PathType Leaf)) {
              throw "Windows bundle is missing $file"
            }
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath lantern-windows-portable.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lantern-release-windows
          path: |
            lantern-installer.exe
            lantern-windows-portable.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: lantern-release-apk
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: lantern-release-windows
          path: release-assets

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          base_version="${VERSION%%+*}"
          tag="${REQUESTED_TAG:-v${base_version}}"
          args=(--title "Lantern ${base_version}" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$tag" "release-assets/lantern-installer.apk" "release-assets/lantern-installer.exe" "release-assets/lantern-windows-portable.zip" "${args[@]}"
