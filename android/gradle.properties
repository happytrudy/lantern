org.gradle.caching=true
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
#This will prevent crashes with the Stripe SDK on Android
#DO NOT CHANGE
android.enableR8.fullMode=false

# Bundle the barcode model in the APK so scanning works without Google Play
# Services or a first-run network download.
dev.steenbakker.mobile_scanner.useUnbundled=false
